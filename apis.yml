name: Sesh
description: Sesh (Sesh Products US, Sesh+) is an Austin, Texas consumer packaged goods company
  that manufactures and sells tobacco-free nicotine pouches. Products ship in multiple flavors
  (Mint, Wintergreen, Clear, Mango, Cappuccino, Raspberry Lemon) and strengths (4mg, 6mg, 8mg),
  sold direct-to-consumer via subscription and through 5,000+ retailers. Surfaced as an 8vc
  portfolio company and added to the API Evangelist network. Enrichment found no public API,
  developer portal, or machine-readable developer surface — this is a physical-goods brand
  running on a Shopify storefront, so the profile carries identity and domain-security only.
